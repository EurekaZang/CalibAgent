/**:
    ros__parameters:
        localization_mode: true
        prior_map_path: "/home/unitree/ws_localization/src/FAST_LIO/PCD/scans.pcd"

        feature_extract_enable: false
        point_filter_num: 4
        max_iteration: 4
        filter_size_surf: 0.5
        filter_size_map: 0.2
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        localization:
            use_rviz_init_pose: true
            publish_tf: false
            map_frame: "map"
            base_frame: "base_link"
            prior_map_filter_size: 0.2
            init_pose: [0.0, 0.0, 0.0, 0.0]
            update_map: false
            max_vel: 2.5
            max_jump: 0.8
            max_z_drift: 0.3
            max_abs_z: 0.0
            max_tilt_deg: 0.0
            min_effect_ratio_pct: 25
            tracking_min_effect_ratio_pct: 12
            min_effect_points: 80
            health_min_ratio_pct: 0
            lost_streak_limit: 20
            recovery_streak_required: 20

        common:
            lid_topic:  "/livox/lidar"
            imu_topic:  "/livox/imu"
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 1
            scan_line:  4
            blind: 0.5
            timestamp_unit: 3
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     100.0
            gravity_align_en: true
            extrinsic_est_en:  false
            extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
            extrinsic_R: [ 1., 0., 0.,
                            0., 1., 0.,
                            0., 0., 1.]

        publish:
            path_en: false
            effect_map_en: false
            map_en: true
            scan_publish_en:  true
            dense_publish_en: false
            scan_bodyframe_pub_en: false

        pcd_save:
            pcd_save_en: false
            interval: -1
