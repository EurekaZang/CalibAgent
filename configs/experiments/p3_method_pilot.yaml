# Method-completeness pilot. These seeds are development-only and may not be
# used in the preregistered main experiment.
output_dir: outputs/p3_method_pilot
seeds: [11, 23, 37, 53, 71]
methods: [active, lhs, random, sobol, d_opt, active_no_task, dense]
families: [affine, deadzone, heteroscedastic]
max_trials: 160
seed_design_count: 6
candidate_count: 256
task_grid_size: 256
evaluation_grid_size: 400
prior_scale: 1.0
assumed_noise_variance: [0.000625, 0.000324, 0.001225]
target_rmse: 0.04
target_uncertainty: 0.0015
risk_weight: 0.0
distance_weight: 0.0
task_centers:
  - [0.55, 0.0, 0.0]
  - [0.30, 0.0, 0.70]
  - [0.30, 0.0, -0.70]
task_scales:
  - [0.14, 0.08, 0.18]
  - [0.12, 0.08, 0.16]
  - [0.12, 0.08, 0.16]
task_mixture_weights: [0.5, 0.25, 0.25]
