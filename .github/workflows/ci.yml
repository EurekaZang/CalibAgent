name: Software CI (not a publication gate)

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r env/analysis/requirements.lock.txt -r env/analysis/requirements-dev.lock.txt
      - run: python -m pip install --no-deps -e .
      - run: ./scripts/audit_source_delivery.sh --local-only
      - run: ruff check .
      - run: mypy src/calibagent scripts/build_readme_figures.py scripts/build_isaac_response_card.py
      - run: python scripts/build_readme_figures.py --output /tmp/p7_slalom_seed_8006.png
      - run: pytest -p pytest_cov --cov=calibagent --cov-report=term-missing
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      - run: python -m calibagent.cli.audit_readiness --workspace .
