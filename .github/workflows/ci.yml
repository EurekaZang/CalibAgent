name: Software CI (not a publication gate)

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r env/analysis/requirements.lock.txt -r env/analysis/requirements-dev.lock.txt
      - run: python -m pip install --no-deps -e .
      - run: ./scripts/audit_source_delivery.sh --local-only
      - run: ruff check .
      - run: mypy src/calibagent
      - run: pytest -p pytest_cov --cov=calibagent --cov-report=term-missing
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      - run: python -m calibagent.cli.audit_readiness --workspace .
